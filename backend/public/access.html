<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console | AeroBite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-brand {
            font-family: 'Unbounded', sans-serif;
        }
    </style>
</head>

<body
    class="min-h-screen bg-[#0A0A0A] text-white flex items-center justify-center p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#0A0A0A] to-[#0A0A0A]">

    <div class="w-full max-w-md text-center">
        <!-- Logo Icon -->
        <div
            class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-orange-500 to-orange-600 mb-8 shadow-[0_0_40px_-5px_rgba(249,115,22,0.3)]">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                </path>
            </svg>
        </div>

        <h1 class="text-3xl font-bold mb-2 font-brand tracking-tight">Admin Console</h1>
        <p class="text-slate-500 mb-10 text-sm">Restricted access area. Authorized personnel only.</p>

        <div class="bg-[#111] border border-white/5 rounded-3xl p-8 shadow-2xl backdrop-blur-xl">
            <form id="accessForm" class="space-y-5 text-left">

                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-slate-500 font-bold mb-2 ml-1">Admin
                        Secret Key</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-orange-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z">
                                    </path>
                                </svg>
                            </span>
                        </div>
                        <input type="password" id="password" placeholder="Enter secure key"
                            class="w-full bg-[#1A1A1A] border border-white/10 text-white text-sm rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-transparent block pl-10 p-3.5 outline-none transition placeholder-slate-600"
                            required>
                    </div>
                </div>

                <!-- Dummy fields to match screenshot visuals -->
                <div>
                    <label
                        class="block text-[10px] uppercase tracking-wider text-slate-500 font-bold mb-2 ml-1">Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-slate-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                    </path>
                                </svg>
                            </span>
                        </div>
                        <input type="email" placeholder="admin@feasto.food" disabled
                            class="w-full bg-[#1A1A1A]/50 border border-white/5 text-slate-500 text-sm rounded-xl block pl-10 p-3.5 cursor-not-allowed select-none">
                    </div>
                </div>

                <div>
                    <label
                        class="block text-[10px] uppercase tracking-wider text-slate-500 font-bold mb-2 ml-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-slate-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                                    </path>
                                </svg>
                            </span>
                        </div>
                        <input type="password" value="........" disabled
                            class="w-full bg-[#1A1A1A]/50 border border-white/5 text-slate-500 text-sm rounded-xl block pl-10 p-3.5 cursor-not-allowed select-none">
                    </div>
                </div>

                <button type="submit"
                    class="w-full text-black bg-white hover:bg-slate-200 font-bold rounded-xl text-sm px-5 py-3.5 transition text-center mt-6 flex items-center justify-center gap-2 group">
                    Sign In
                    <svg class="w-4 h-4 group-hover:translate-x-1 transition" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </button>
                <p id="error"
                    class="text-red-500 text-xs text-center hidden font-medium bg-red-500/10 py-2 rounded-lg border border-red-500/20">
                    Invalid Access Key</p>
            </form>

            <p class="text-[10px] text-slate-600 text-center mt-6">
                Need access? Contact system support.<br>
                IP Logged: <span class="text-slate-500">192.168.x.x</span>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('accessForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error');

            try {
                const res = await fetch('/api/verify-access', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    window.location.reload();
                } else {
                    errorMsg.classList.remove('hidden');
                    document.getElementById('password').value = '';
                }
            } catch (err) {
                console.error(err);
                errorMsg.innerText = "Connection Error";
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
