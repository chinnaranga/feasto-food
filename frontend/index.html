<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Apple Web App Metadata -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Feasto" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- SEO & Discovery -->
    <title>Feasto | Discover Food You'll Actually Love</title>
    <meta name="description" content="Discover restaurants, dishes and personalized food recommendations near you with Feasto." />
    <meta name="keywords" content="food delivery, AI food recommendation, restaurant discovery, organic meal prep, gourmet dining online" />
    <meta name="author" content="Feasto Inc." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://feasto.ai" />
    <meta property="og:title" content="Feasto | AI-Powered Food Discovery & Delivery" />
    <meta property="og:description" content="Describe your craving, mood, or goal. Feasto's recommendation engine finds the perfect culinary match for fast, premium delivery." />
    <meta property="og:image" content="https://feasto.ai/og-preview.png" />
    <meta property="og:site_name" content="Feasto" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://feasto.ai" />
    <meta name="twitter:title" content="Feasto | AI-Powered Food Discovery & Delivery" />
    <meta name="twitter:description" content="Describe your craving, mood, or goal. Feasto's recommendation engine finds the perfect culinary match for fast, premium delivery." />
    <meta name="twitter:image" content="https://feasto.ai/og-preview.png" />

    <meta name="theme-color" content="#F3F0E8" />

    <!-- Preconnect & Google Fonts for Feasto Canvas Editorial Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased font-sans bg-[#F3F0E8] text-[#141518] selection:bg-[#D7F04A] selection:text-[#141518]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
