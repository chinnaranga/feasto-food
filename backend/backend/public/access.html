<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Console | AeroBite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f0f12;
            color: white;
        }

        .font-brand {
            font-family: 'Outfit', sans-serif;
        }

        .liquid-card {
            background: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .aurora-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 10% 10%, rgba(249, 115, 22, 0.1), transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(220, 38, 38, 0.1), transparent 50%);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 bg-[#0f0f12]">

    <div class="aurora-bg"></div>

    <div class="w-full max-w-md text-center">
        <!-- Logo Icon -->
        <div
            class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-gradient-to-br from-orange-500 to-red-600 mb-8 shadow-2xl shadow-orange-500/30">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                </path>
            </svg>
        </div>

        <h1 class="text-3xl font-bold mb-2 font-brand tracking-tight text-white">Admin Console</h1>
        <p class="text-slate-400 mb-10 text-sm">Restricted access area. Authorized personnel only.</p>

        <div class="liquid-card rounded-3xl p-8 backdrop-blur-xl">
            <form id="accessForm" class="space-y-6 text-left">

                <div>
                    <label class="block text-[11px] uppercase tracking-wider text-slate-500 font-bold mb-2 ml-1">Admin
                        Secret Key</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="text-orange-500">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z">
                                    </path>
                                </svg>
                            </span>
                        </div>
                        <input type="password" id="password" placeholder="Enter secure key"
                            class="w-full bg-[#18181b] border border-white/10 text-white text-sm rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-transparent block pl-12 p-3.5 outline-none transition placeholder-slate-600 hover:bg-white/5"
                            required>
                    </div>
                </div>

                <!-- Dummy fields to match visuals -->
                <div>
                    <label
                        class="block text-[11px] uppercase tracking-wider text-slate-500 font-bold mb-2 ml-1">Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="text-slate-600">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                    </path>
                                </svg>
                            </span>
                        </div>
                        <input type="email" placeholder="admin@feasto.food" disabled
                            class="w-full bg-[#18181b]/50 border border-white/5 text-slate-500 text-sm rounded-xl block pl-12 p-3.5 cursor-not-allowed select-none">
                    </div>
                </div>

                <div>
                    <label
                        class="block text-[11px] uppercase tracking-wider text-slate-500 font-bold mb-2 ml-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="text-slate-600">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                                    </path>
                                </svg>
                            </span>
                        </div>
                        <input type="password" value="........" disabled
                            class="w-full bg-[#18181b]/50 border border-white/5 text-slate-500 text-sm rounded-xl block pl-12 p-3.5 cursor-not-allowed select-none">
                    </div>
                </div>

                <button type="submit"
                    class="w-full text-white bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 hover:to-red-700 font-bold rounded-xl text-lg px-5 py-3.5 transition text-center shadow-lg shadow-orange-500/20 transform hover:-translate-y-1">
                    Sign In
                </button>
                <p id="error"
                    class="text-red-400 text-xs text-center hidden font-medium bg-red-500/10 py-3 rounded-xl border border-red-500/20">
                    Invalid Access Key</p>
            </form>

            <p class="text-[10px] text-slate-600 text-center mt-8 font-mono">
                Need access? Contact system support.<br>
                IP Logged: <span class="text-slate-500">192.168.x.x</span>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('accessForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error');

            try {
                const res = await fetch('/api/verify-access', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    window.location.reload();
                } else {
                    errorMsg.classList.remove('hidden');
                    document.getElementById('password').value = '';
                }
            } catch (err) {
                console.error(err);
                errorMsg.innerText = "Connection Error";
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
