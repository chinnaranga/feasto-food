<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroBite API | Access Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="min-h-screen bg-slate-950 text-slate-200 flex items-center justify-center p-6">

    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-slate-800 mb-4 text-2xl">
                🔒
            </div>
            <h1 class="text-xl font-bold text-white">System Access</h1>
            <p class="text-slate-400 text-sm mt-1">Enter credentials to view status.</p>
        </div>

        <form id="accessForm" class="space-y-4">
            <div>
                <input type="password" id="password" placeholder="Enter Access Key"
                    class="w-full bg-slate-950 border border-slate-700 text-white text-sm rounded-lg focus:ring-orange-500 focus:border-orange-500 block p-3 outline-none transition"
                    required>
            </div>
            <button type="submit"
                class="w-full text-white bg-orange-600 hover:bg-orange-700 focus:ring-4 focus:ring-orange-500/20 font-medium rounded-lg text-sm px-5 py-3 transition text-center">
                Authenticate
            </button>
            <p id="error" class="text-red-500 text-xs text-center hidden">Invalid Access Key</p>
        </form>

        <div class="mt-6 text-center">
            <a href="https://feasto.food" class="text-xs text-slate-500 hover:text-white transition">Return to
                feasto.food</a>
        </div>
    </div>

    <script>
        document.getElementById('accessForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error');

            try {
                const res = await fetch('/api/verify-access', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (res.ok) {
                    window.location.reload(); // Reload to hit GET / again, which will now serve status.html
                } else {
                    errorMsg.classList.remove('hidden');
                    document.getElementById('password').value = '';
                }
            } catch (err) {
                console.error(err);
                errorMsg.innerText = "Connection Error";
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
